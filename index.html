<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0c" />
    <meta name="description" content="OpenCrew — a home for your AI crew." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/mark.svg" type="image/svg+xml" />
    <script>
      (() => {
        const saved = localStorage.getItem("opencrew:theme");
        const theme = saved === "light" || saved === "dark"
          ? saved
          : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "light" ? "#f6f6f8" : "#0b0b0c";
      })();
    </script>
    <title>OpenCrew</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
